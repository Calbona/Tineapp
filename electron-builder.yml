appId: com.tineapp.worldbuilder
productName: Tineapp
copyright: Copyright © 2024
electronDownload:
  cache: true

directories:
  output: release
  buildResources: public/assets/icons

files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
  - package.json
  - "!public/assets/icons/button0.png"

asarUnpack:
  - public/**/*

win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/assets/icons/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Tineapp

mac:
  target: dmg
  category: public.app-category.productivity
  icon: public/assets/icons/icon.png

linux:
  target: AppImage
  category: Office
  icon: public/assets/icons/icon.png
